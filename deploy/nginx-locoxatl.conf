# LOCOXATL — Nginx reverse proxy for the Node app plus persistent image serving.
#
# Install (see deploy/VPS_MIGRATION.md for the full walkthrough):
#   sudo cp deploy/nginx-locoxatl.conf /etc/nginx/sites-available/locoxatl
#   sudo ln -s /etc/nginx/sites-available/locoxatl /etc/nginx/sites-enabled/locoxatl
#   sudo nginx -t && sudo systemctl reload nginx
#
# Uploaded images are served by Nginx directly from the persistent volume, so the Node process
# never has to stream them and /var/lib/locoxatl/uploads/ stays the single source of truth.

upstream locoxatl_app {
    server 127.0.0.1:4173;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name locoxatl.ddns.net;

    # Certbot's HTTP-01 challenge is answered before the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name locoxatl.ddns.net;

    ssl_certificate     /etc/letsencrypt/live/locoxatl.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/locoxatl.ddns.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # A 5 MB image arrives base64-encoded, which is roughly 6.7 MB on the wire.
    client_max_body_size 10m;

    # Uploaded images: straight from the volume, no listing, no script execution.
    location /uploads/ {
        alias /var/lib/locoxatl/uploads/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Anything that looks like a hidden file is never served.
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://locoxatl_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
